<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee7;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #2563eb;
      --ok: #0f766e;
      --warn: #b45309;
      --bad: #b91c1c;
      --code: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }
    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }
    header .meta {
      color: var(--muted);
      font-size: 13px;
    }
    .layout {
      height: calc(100vh - 56px);
      display: grid;
      grid-template-columns: 230px minmax(360px, 1fr) minmax(360px, 420px);
      min-width: 0;
    }
    aside, main, .chat {
      min-height: 0;
      overflow: auto;
    }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 14px;
    }
    .run-item {
      display: block;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      color: inherit;
      text-decoration: none;
    }
    .run-item:hover {
      border-color: #9fb4f6;
    }
    .run-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.12);
    }
    .run-item strong { display: block; margin-bottom: 4px; }
    .run-item span { color: var(--muted); font-size: 12px; }
    .run-item span.ok { color: var(--ok); }
    .run-item span.warn { color: var(--warn); }
    .run-item span.bad { color: var(--bad); }
    .run-item small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }
    .run-item small.ok { color: var(--ok); }
    .run-item small.warn { color: var(--warn); }
    .run-item small.bad { color: var(--bad); }
    .muted-run {
      opacity: 0.75;
    }
    main {
      padding: 18px;
    }
    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .title-row h2 {
      margin: 0 0 4px;
      font-size: 20px;
    }
    .title-row p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .status-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 10px;
      min-height: 58px;
    }
    .status-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }
    .status-card strong {
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .status-card.ok { border-left: 4px solid var(--ok); }
    .status-card.warn { border-left: 4px solid var(--warn); }
    .status-card.bad { border-left: 4px solid var(--bad); }
    .artifact {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .artifact summary {
      cursor: pointer;
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      font-weight: 600;
    }
    .artifact summary small {
      color: var(--muted);
      font-weight: 400;
      overflow-wrap: anywhere;
      text-align: right;
    }
    pre {
      margin: 0;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--code);
      color: #e5e7eb;
      overflow: auto;
      max-height: 360px;
      font-size: 12px;
      line-height: 1.45;
    }
    .plot-wrap {
      border-top: 1px solid var(--line);
      padding: 12px;
      background: #f9fafb;
    }
    .image-wrap {
      border-top: 1px solid var(--line);
      padding: 12px;
      background: #f9fafb;
      overflow: auto;
    }
    .image-wrap img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border: 1px solid var(--line);
      background: white;
    }
    .image-missing {
      color: var(--muted);
      font-size: 13px;
    }
    .plot-wrap img {
      display: block;
      max-width: 100%;
      border: 1px solid var(--line);
      background: white;
    }
    .comparison-wrap {
      border-top: 1px solid var(--line);
      padding: 12px;
      overflow: auto;
      background: #f9fafb;
    }
    .outcome-banner {
      display: grid;
      gap: 4px;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }
    .outcome-banner strong {
      font-size: 14px;
    }
    .outcome-banner span,
    .outcome-banner small {
      color: var(--muted);
      line-height: 1.35;
    }
    .outcome-banner.ok { border-left: 4px solid var(--ok); }
    .outcome-banner.warn { border-left: 4px solid var(--warn); }
    .outcome-banner.bad { border-left: 4px solid var(--bad); }
    .comparison-wrap table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid var(--line);
      font-size: 12px;
    }
    .comparison-wrap th,
    .comparison-wrap td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    .comparison-wrap th {
      color: var(--muted);
      font-weight: 650;
      background: #f3f4f6;
    }
    .chat {
      border-left: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .chat-header {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .chat-header h2 {
      margin: 0 0 4px;
      font-size: 16px;
    }
    .chat-header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .chat-clear {
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--muted);
      padding: 6px 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .chat-clear:hover {
      background: #eef2ff;
      color: var(--accent);
    }
    .messages {
      padding: 14px;
      overflow: auto;
      overflow-x: hidden;
    }
    .message {
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      line-height: 1.45;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .message.agent {
      background: #eef4ff;
      border: 1px solid #c7d7fe;
    }
    .message.user {
      background: #f3f4f6;
      border: 1px solid var(--line);
    }
    .message.debug {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #7c2d12;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      white-space: normal;
    }
    .message.debug details {
      max-width: 100%;
    }
    .message.debug summary {
      cursor: pointer;
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 650;
    }
    .message.debug pre {
      margin-top: 8px;
      border: 0;
      border-radius: 6px;
      max-height: 140px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .message-content > :first-child { margin-top: 0; }
    .message-content > :last-child { margin-bottom: 0; }
    .message-content h2,
    .message-content h3 {
      margin: 12px 0 6px;
      font-size: 15px;
      line-height: 1.25;
    }
    .message-content p {
      margin: 0 0 8px;
    }
    .message-content ul,
    .message-content ol {
      margin: 0 0 10px 20px;
      padding: 0;
    }
    .message-content li {
      margin: 4px 0;
    }
    .message-content code {
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.08);
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.9em;
      overflow-wrap: anywhere;
    }
    .message-content pre {
      margin: 8px 0;
      padding: 10px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 6px;
      background: #0f172a;
      color: #e5e7eb;
      overflow: auto;
      max-height: 220px;
      white-space: pre;
    }
    .message-content pre code {
      padding: 0;
      background: transparent;
      color: inherit;
      font-size: 12px;
      overflow-wrap: normal;
      word-break: normal;
    }
    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      min-height: 20px;
    }
    .typing-line {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 600;
    }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #64748b;
      animation: typing-bounce 1s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    .chat-form {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    textarea {
      width: 100%;
      min-height: 86px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--accent);
      color: white;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.96); }
    button:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }
    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 190px minmax(320px, 1fr) minmax(340px, 390px);
      }
    }
    @media (max-width: 900px) {
      header {
        height: auto;
        min-height: 56px;
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
        padding: 10px 14px;
      }
      .layout {
        height: auto;
        min-height: calc(100vh - 76px);
        display: flex;
        flex-direction: column;
      }
      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .chat {
        min-height: 520px;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Pipeline 2.0 Diagnostic Web Chat</h1>
    <div class="meta">{{HEADER_META}}</div>
  </header>
  <div class="layout">
    <aside>
      {{RUN_SELECTOR}}
    </aside>
    <main>
      <div class="title-row">
        <div>
          <h2>{{ACTIVE_RUN_TITLE}}</h2>
          <p>{{OUTPUT_DIR}}</p>
        </div>
      </div>
      <section class="status-grid">
        {{STATUS_CARDS}}
      </section>
      <section>
        {{IMAGE_SECTION}}
      </section>
      <section>
        {{ARTIFACTS}}
      </section>
    </main>
    <section class="chat">
      <div class="chat-header">
        <div>
          <h2>Diagnostic chat</h2>
          <p>Write a symptom. The read-only agent will analyze the current SPICE run.</p>
        </div>
        <button class="chat-clear" id="clearChatButton" type="button">Clear</button>
      </div>
      <div class="messages" id="messages">
      </div>
      <form class="chat-form" id="chatForm">
        <textarea id="chatInput" placeholder="Example: Perche il LED non si accende?"></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </div>
  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("chatInput");
    const messages = document.getElementById("messages");
    const submitButton = form.querySelector("button");
    const clearChatButton = document.getElementById("clearChatButton");
    const chatStorageKey = "{{CHAT_STORAGE_KEY}}";
    const welcomeMessage = "Describe the circuit symptom and I will analyze the current pipeline outputs.";
    let chatHistory = [];

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderInlineMarkdown(text) {
      let safe = escapeHtml(text);
      safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
      safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      safe = safe.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return safe;
    }

    function flushParagraph(lines, htmlParts) {
      if (!lines.length) return;
      htmlParts.push("<p>" + renderInlineMarkdown(lines.join(" ")) + "</p>");
      lines.length = 0;
    }

    function renderMarkdown(text) {
      // Renderer Markdown volutamente piccolo: basta per risposte agente, liste e codice.
      const lines = text.replace(/\r\n/g, "\n").split("\n");
      const htmlParts = [];
      const paragraph = [];
      let inCode = false;
      let codeLines = [];
      let inList = false;
      let listType = "";

      function closeList() {
        if (!inList) return;
        htmlParts.push("</" + listType + ">");
        inList = false;
        listType = "";
      }

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();

        if (line.trim().startsWith("```")) {
          if (inCode) {
            htmlParts.push("<pre><code>" + escapeHtml(codeLines.join("\n")) + "</code></pre>");
            codeLines = [];
            inCode = false;
          } else {
            flushParagraph(paragraph, htmlParts);
            closeList();
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          codeLines.push(rawLine);
          continue;
        }

        if (!line.trim()) {
          flushParagraph(paragraph, htmlParts);
          closeList();
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph(paragraph, htmlParts);
          closeList();
          const level = heading[1].length === 1 ? "h2" : "h3";
          htmlParts.push("<" + level + ">" + renderInlineMarkdown(heading[2]) + "</" + level + ">");
          continue;
        }

        const unordered = line.match(/^\s*[-*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph(paragraph, htmlParts);
          const currentType = unordered ? "ul" : "ol";
          if (!inList || listType !== currentType) {
            closeList();
            htmlParts.push("<" + currentType + ">");
            inList = true;
            listType = currentType;
          }
          htmlParts.push("<li>" + renderInlineMarkdown((unordered || ordered)[1]) + "</li>");
          continue;
        }

        closeList();
        paragraph.push(line.trim());
      }

      if (inCode) {
        htmlParts.push("<pre><code>" + escapeHtml(codeLines.join("\n")) + "</code></pre>");
      }
      flushParagraph(paragraph, htmlParts);
      closeList();
      return htmlParts.join("");
    }

    function saveChatHistory() {
      localStorage.setItem(chatStorageKey, JSON.stringify(chatHistory));
    }

    function loadChatHistory() {
      try {
        const rawHistory = localStorage.getItem(chatStorageKey);
        const parsed = rawHistory ? JSON.parse(rawHistory) : [];
        chatHistory = Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        chatHistory = [];
      }
    }

    function addMessage(kind, text, options = {}) {
      const node = document.createElement("div");
      node.className = "message " + kind;
      if (options.html) {
        node.innerHTML = text;
      } else if (kind === "agent") {
        const content = document.createElement("div");
        content.className = "message-content";
        content.innerHTML = renderMarkdown(text);
        node.appendChild(content);
      } else {
        node.textContent = text;
      }
      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
      if (!options.temporary && kind !== "debug") {
        chatHistory.push({kind, text});
        saveChatHistory();
      }
      return node;
    }

    function restoreMessages() {
      messages.innerHTML = "";
      loadChatHistory();
      if (!chatHistory.length) {
        addMessage("agent", welcomeMessage);
        return;
      }

      const restoredHistory = [...chatHistory];
      chatHistory = [];
      for (const item of restoredHistory) {
        if (!item || !item.kind || typeof item.text !== "string") continue;
        addMessage(item.kind, item.text);
      }
    }

    function addTypingMessage(label = "Agent is thinking") {
      return addMessage(
        "agent",
        '<div class="typing-line"><span>' + escapeHtml(label) + '</span><div class="typing" aria-label="' + escapeHtml(label) + '"><span></span><span></span><span></span></div></div>',
        {html: true, temporary: true}
      );
    }

    function addDebugMessage(debugItems) {
      if (!debugItems || !debugItems.length) return;
      const debugText = escapeHtml(debugItems.join("\n"));
      addMessage(
        "debug",
        "<details><summary>Execution details</summary><pre>" + debugText + "</pre></details>",
        {html: true, temporary: true}
      );
    }

    function setLoading(isLoading) {
      input.disabled = isLoading;
      submitButton.disabled = isLoading;
      submitButton.textContent = isLoading ? "Running..." : "Send";
    }

    function isScenarioRequest(text) {
      return /\bscenario\s*\d+\b/i.test(text) || /\b(primo|secondo|terzo)\b/i.test(text);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage("user", text);
      input.value = "";
      setLoading(true);
      const scenarioRequest = isScenarioRequest(text);
      const typingNode = addTypingMessage(scenarioRequest ? "Executing scenario" : "Agent is thinking");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: text})
        });
        const data = await response.json();
        typingNode.remove();
        addMessage("agent", data.reply || "No response returned.");
        addDebugMessage(data.debug);
        if (data.active_run) {
          setTimeout(() => {
            window.location.href = "/?run=" + encodeURIComponent(data.active_run);
          }, 900);
        }
      } catch (error) {
        typingNode.remove();
        addMessage("agent", "Chat request failed. Check the local server terminal.");
      } finally {
        setLoading(false);
        input.focus();
      }
    });

    clearChatButton.addEventListener("click", () => {
      chatHistory = [];
      localStorage.removeItem(chatStorageKey);
      messages.innerHTML = "";
      addMessage("agent", welcomeMessage);
      input.focus();
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    restoreMessages();
  </script>
</body>
</html>

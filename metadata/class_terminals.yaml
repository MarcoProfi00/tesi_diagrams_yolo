31:
  name: Voltage_Source
  symbol_type: two_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: fixed
  terminals:
    - name: t1
      relative_position: top
    - name: t2
      relative_position: bottom
  notes: "Classe iniziale pilota"

22:
  name: Resistor
  symbol_type: two_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: auto_by_aspect_ratio
  default_orientation: horizontal
  orientations:
    horizontal:
      - name: t1
        relative_position: left
      - name: t2
        relative_position: right
    vertical:
      - name: t1
        relative_position: top
      - name: t2
        relative_position: bottom
  notes: "Resistenza con orientazione automatica"

4:
  name: Capacitor
  symbol_type: two_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: auto_by_aspect_ratio
  default_orientation: vertical
  orientations:
    horizontal:
      - name: t1
        relative_position: left
      - name: t2
        relative_position: right
    vertical:
      - name: t1
        relative_position: top
      - name: t2
        relative_position: bottom
  notes: "Condensatore con orientazione automatica"

26:
  name: Terminal
  symbol_type: one_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: fixed
  terminals:
    - name: t1
      relative_position: left
  notes: "Per il terminale V0; da rivedere se necessario"

9:
  name: GND
  symbol_type: one_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: fixed
  terminals:
    - name: t1
      relative_position: top
  notes: "Massa; trattata come nodo a un terminale"

16:
  name: Mosfet
  symbol_type: multi_terminal
  use_for_terminals: false
  use_for_masking: true
  notes: "Per ora solo mascheramento, terminali da aggiungere dopo"
# Modelli SPICE usati dalla Pipeline 2.0.
#
# Per ora questi modelli sono scelti manualmente nei file values.yaml tramite
# il campo "model". Lo step 07 legge questo file e inserisce nella netlist solo
# i modelli effettivamente richiesti dai componenti del circuito.

models:
  D_GENERIC:
    # Modello minimale per diodi rettificatori o di rivelazione senza part number.
    line: ".model D_GENERIC D"

  LED_RED:
    line: ".model LED_RED D"

  LED_YELLOW:
    # Modello LED minimale distinto per conservare il colore dichiarato.
    line: ".model LED_YELLOW D"

  LED_GREEN:
    # Modello LED minimale distinto per conservare il colore dichiarato.
    line: ".model LED_GREEN D"

  1N4148:
    # Modello semplificato del diodo switching: tensione inversa e tempi
    # principali sono coerenti con la famiglia 1N4148, senza legarsi a un
    # singolo produttore.
    line: ".model 1N4148 D(BV=100 IBV=100u TT=4n CJO=4p)"

  BZX79C10:
    # Zener BZX79 serie C: valore nominale 10 V alla corrente di prova 5 mA.
    line: ".model BZX79C10 D(BV=10 IBV=5m)"

  BZX79C12:
    # Zener BZX79 serie C: valore nominale 12 V alla corrente di prova 5 mA.
    line: ".model BZX79C12 D(BV=12 IBV=5m)"

  2N3904:
    line: ".model 2N3904 NPN(IS=6.734f BF=416.4 VAF=74.03 IKF=66.78m ISE=6.734f NE=1.259 BR=0.7371 VAR=12.11 IKR=0.0 ISC=0.0 NC=2 RB=10 RC=1 RE=0.1 CJE=4.493p VJE=0.75 MJE=0.2593 CJC=3.638p VJC=0.75 MJC=0.3085 TF=301.2p TR=239.5n)"

  PNP_GENERIC:
    # Modello PNP minimale per schemi che non riportano un part number.
    line: ".model PNP_GENERIC PNP"

  2N2222:
    line: ".model 2N2222 NPN(IS=14.34f BF=255.9 VAF=74.03 IKF=0.2847 ISE=14.34f NE=1.307 BR=6.092 NR=1.005 VAR=11.96 IKR=0.0 ISC=0.0 NC=2 RB=10 RC=1 RE=0.1 CJE=22.01p VJE=0.75 MJE=0.377 CJC=7.306p VJC=0.75 MJC=0.3416 TF=411.1p TR=46.91n)"

  BC547:
    line: ".model BC547 NPN"

  BC557:
    # Modello PNP minimale, coerente con il livello di dettaglio del BC547
    # gia presente nel registro. Il suffisso di guadagno A/B/C non e visibile.
    line: ".model BC557 PNP"

  BC547_TYP:
    # Modello tipico isolato per circuiti di soglia. BF=250 assume il gruppo
    # intermedio B quando il suffisso A/B/C non e leggibile nello schema.
    line: ".model BC547_TYP NPN(BF=250 VAF=50 IKF=100m)"

  BC557_TYP:
    # Complementare PNP del modello tipico BC547 usato nello stesso banco.
    line: ".model BC557_TYP PNP(BF=250 VAF=50 IKF=100m)"

  D_1N4148_TYP:
    # Modello tipico del diodo switching. La curva diretta e calibrata nella
    # fascia del datasheet; BV, capacita e recovery restano valori di targa.
    line: ".model D_1N4148_TYP D(IS=6n N=1.9 RS=0.65 BV=100 IBV=100u TT=4n CJO=4p)"

  D_1N4001_TYP:
    # Modello rettificatore semplificato per la famiglia 1N4001, sufficiente
    # alla base run a 50 Hz senza dichiarare un produttore specifico.
    line: ".model D_1N4001_TYP D(IS=14n N=1.9 RS=0.08 BV=50 IBV=5u TT=2u CJO=25p)"

  BC148_TYP:
    # BC148 NPN di piccolo segnale: parametri tipici cauti per una prima
    # simulazione di soglia, non sostitutivi di un datasheet selezionato.
    line: ".model BC148_TYP NPN(BF=110 VAF=50 IKF=100m IS=1e-14)"

  SCR_2N3668_TYP:
    # Equivalente SCR generale a tre terminali A-G-K. Una conduttanza
    # comportamentale continua evita la discontinuita' numerica del commutatore
    # ideale durante l'innesco; nel caricabatteria a semionda il gate comanda
    # comunque la conduzione solo nel semiperiodo positivo.
    lines:
      header: ".subckt SCR_2N3668_TYP A G K"
      main: "BMAIN A K I={V(A,K)*(1/10Meg+(1/0.05-1/10Meg)*(0.5+0.5*tanh((V(G,K)-0.75)/0.08)))}"
      gate_resistor: "RGK G K 100"
      footer: ".ends SCR_2N3668_TYP"

  BZX79C10_TYP:
    # NBV approssima la resistenza differenziale tipica dichiarata a 1 mA e
    # 5 mA senza spostare la tensione nominale di breakdown a 10 V.
    line: ".model BZX79C10_TYP D(BV=10 IBV=5m NBV=1.7)"

  BZX79C12_TYP:
    # NBV approssima la resistenza differenziale tipica dichiarata a 1 mA e
    # 5 mA senza spostare la tensione nominale di breakdown a 12 V.
    line: ".model BZX79C12_TYP D(BV=12 IBV=5m NBV=1.9)"

  LED_RED_TYP:
    # LED generico rosso: il part number non e indicato, quindi il modello
    # rappresenta soltanto una caduta diretta tipica del colore.
    line: ".model LED_RED_TYP D(IS=1e-15 N=2 RS=10)"

  LED_YELLOW_TYP:
    # LED generico giallo distinto dal rosso per la caduta diretta tipica.
    line: ".model LED_YELLOW_TYP D(IS=1e-17 N=2 RS=10)"

  LED_GREEN_TYP:
    # LED generico verde distinto dagli altri colori; non sostituisce un
    # modello di part number specifico non disponibile nell'immagine.
    line: ".model LED_GREEN_TYP D(IS=1e-18 N=2 RS=10)"

  LM386_SIMPLE:
    # Equivalente lineare generale a cinque terminali per una prima base run.
    # Rappresenta soltanto ingresso differenziale, guadagno in tensione circa
    # 20 e resistenza d'uscita; non sostituisce il macromodello del produttore.
    lines:
      header: ".subckt LM386_SIMPLE INP INM VCC VEE OUT"
      input_resistance: "RIN INP INM 50k"
      amplifier: "EAMP NAMP VEE INP INM 20"
      output_resistance: "ROUT NAMP OUT 5"
      supply_bleed: "RBLEED VCC VEE 100k"
      footer: ".ends LM386_SIMPLE"

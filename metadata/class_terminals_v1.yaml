0:
  name: Analog_Meter
  symbol_type: multi_terminal
  use_for_terminals: false
  use_for_masking: true
  notes: "Per ora solo masking"

1:
  name: Antenna
  symbol_type: one_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: one_terminal_by_orientation
  default_orientation: up
  orientations:
    up:
      - name: t1
        relative_position: bottom
    down:
      - name: t1
        relative_position: top
    left:
      - name: t1
        relative_position: right
    right:
      - name: t1
        relative_position: left
  notes: "Richiede aggiornamento di 03_estimate_terminals.py"

2:

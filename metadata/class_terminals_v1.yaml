    left:
      - name: t1
        relative_position: left
      - name: t2
        relative_position: top
      - name: t3
        relative_position: bottom
    right:
      - name: t1
        relative_position: right
      - name: t2
        relative_position: top
      - name: t3
        relative_position: bottom
    top:
      - name: t1

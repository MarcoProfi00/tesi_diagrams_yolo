  symbol_type: two_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: fixed
  terminals:
    - name: t1
      relative_position: top
    - name: t2
      relative_position: bottom
  notes: "Battery con terminali fissi top/bottom"


0:
  name: Analog_Meter
  symbol_type: two_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: analog_meter_by_posts
  notes: "Batch v9.1: stima strutturata dai due pallini interni del meter, con ingresso sul post non-ground e uscita sul post con stelo verso il basso"

1:
  name: Antenna
  symbol_type: one_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: one_terminal_by_orientation
  default_orientation: up
  orientations:
    up:
      - name: t1
        relative_position: bottom
    down:
      - name: t1
        relative_position: top
    left:
      - name: t1
        relative_position: right
    right:
      - name: t1
        relative_position: left
  notes: "Richiede aggiornamento di 03_estimate_terminals.py"

2:
  name: Battery
  symbol_type: two_terminal
  use_for_terminals: true
  use_for_masking: true
  terminal_strategy: two_terminal_by_connection_axis
  semantic_terminal_strategy: battery_positive_from_long_plate
  semantic_roles:
    marker_side: positive
    other_side: negative
  default_orientation: vertical
  orientations:
    horizontal:
      - name: t1
        relative_position: left
      - name: t2
        relative_position: right
    vertical:
      - name: t1
        relative_position: top
      - name: t2
        relative_position: bottom
  notes: "Battery: polarita stimata dalla plate piu lunga"


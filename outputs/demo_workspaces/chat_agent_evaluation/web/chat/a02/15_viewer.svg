<style>.headset .symbol ellipse{fill:none;stroke:#f4f7fb;stroke-width:3}.headset .audio-wave,.speaker .audio-wave,.antenna .radio-wave{fill:none;stroke:#f4f7fb;stroke-width:2;stroke-linecap:round;opacity:.5}.headset .audio-wave.active,.speaker .audio-wave.active{stroke:#38bdf8;animation:viewerAudioWave 1.25s ease-out infinite}.headset .audio-wave.wave-2.active,.speaker .audio-wave.wave-2.active{animation-delay:.18s}.antenna .radio-wave{animation:viewerRadioWave 1.8s ease-in-out infinite}.antenna .radio-wave.wave-2{animation-delay:.3s}@keyframes viewerAudioWave{0%{opacity:.2}55%{opacity:1}100%{opacity:.2}}@keyframes viewerRadioWave{0%,100%{opacity:.25}50%{opacity:.8}}@media (prefers-reduced-motion:reduce){.headset .audio-wave.active,.speaker .audio-wave.active,.antenna .radio-wave{animation:none}}</style>

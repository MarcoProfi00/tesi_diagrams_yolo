<style>.viewer-svg{background:transparent;font-family:Arial,sans-serif}.wire,.symbol path,.symbol circle,.symbol rect,.connector rect,.connector circle{fill:none;stroke:#f4f7fb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire.energized{fill:none;stroke:#22c55e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire.active,.component-flow,.transistor-flow{fill:none;stroke:#dce51a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 10;animation:viewerCurrent 1s linear infinite}.wire.transient,.component-flow.transient,.transistor-flow.transient{fill:none;stroke:#38bdf8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 9;animation:viewerTransient 1.15s ease-in-out infinite alternate}.wire.idle{stroke:#aeb9c9;stroke-dasharray:10 8;opacity:.9}.wire.guide{stroke:#52647c;stroke-dasharray:3 11;opacity:.8}.scenario-link-idle{stroke:#aeb9c9!important;stroke-dasharray:10 8;opacity:.9}.scenario-link-component{cursor:help}.component-label{fill:#f4f7fb;font-size:13px;font-weight:700;text-anchor:middle;letter-spacing:0}.terminal-label{fill:#f4f7fb;font-size:12px;font-weight:700;letter-spacing:0}.pin-label{fill:#f4f7fb;font-size:12px;font-weight:700;text-anchor:end;letter-spacing:0}.battery-polarity{fill:#cbd5e1;font-size:19px;font-weight:700;text-anchor:middle;letter-spacing:0}.battery-polarity.positive{fill:#f8fafc}.battery-body{fill:#0b1728!important}.scenario-battery-body{fill:#082334!important;stroke:#38bdf8!important}.scenario-added-component,.scenario-modified-component{cursor:help;filter:drop-shadow(0 0 3px rgba(245,158,11,.62))}.scenario-added-component .symbol path,.scenario-added-component .symbol circle,.scenario-added-component .symbol rect,.scenario-modified-component .symbol path,.scenario-modified-component .symbol circle,.scenario-modified-component .symbol rect{stroke:#f59e0b}.scenario-badge{cursor:help}.scenario-badge circle{fill:#111827;stroke:#f59e0b;stroke-width:2}.scenario-badge text{f
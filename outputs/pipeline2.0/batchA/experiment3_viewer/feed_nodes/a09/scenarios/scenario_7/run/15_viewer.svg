<style>.viewer-svg{background:transparent;font-family:Arial,sans-serif}.wire,.symbol path,.symbol circle,.symbol rect,.connector rect,.connector circle{fill:none;stroke:#f4f7fb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire.energized{fill:none;stroke:#22c55e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire.active,.component-flow,.transistor-flow{fill:none;stroke:#dce51a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 10;animation:viewerCurrent 1s linear infinite}.wire.transient,.component-flow.transient,.transistor-flow.transient{fill:none;stroke:#38bdf8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 9;animation:viewerTransient 1.15s ease-in-out infinite alternate}.wire.idle{stroke:#aeb9c9;stroke-dasharray:10 8;opacity:.9}.wire.guide{stroke:#52647c;stroke-dasharray:3 11;opacity:.8}.wire-crossover-mask{fill:#071321;stroke:none}.wire-crossover-bridge{fill:none}.scenario-link-idle{stroke:#aeb9c9!important;stroke-dasharray:10 8;opacity:.9}.scenario-link-component{cursor:help}.component-label{fill:#f4f7fb;font-size:13px;font-weight:700;text-anchor:middle;letter-spacing:0}.terminal-label{fill:#f4f7fb;font-size:12px;font-weight:700;letter-spacing:0}.pin-label{fill:#f4f7fb;font-size:12px;font-weight:700;text-anchor:end;letter-spacing:0}.battery-polarity{fill:#cbd5e1;font-size:19px;font-weight:700;text-anchor:middle;letter-spacing:0}.battery-polarity.positive{fill:#f8fafc}.battery-body{fill:#0b1728!important}.scenario-battery-body{fill:#082334!important;stroke:#38bdf8!important}.scenario-added-component,.scenario-modified-component{cursor:help;filter:drop-shadow(0 0 3px rgba(245,158,11,.62))}.scenario-added-component .symbol path,.scenario-added-component .symbol circle,.scenario-added-component .symbol rect,.scenario-modified-component .symbol path,.scenario-modified-component .symbol circle,.scenario-modified-component .symbol rect{stroke:#f59e0b}.scenario-badge{cursor:help}.scenario-badge circle{fill:#111827;stroke:#f59e0b;stroke-width:2}.scenario-badge text{fill:#fbbf24;font-size:12px;font-weight:700;text-anchor:middle;letter-spacing:0}.battery-glow{fill:#dce51a!important;opacity:.16;stroke:none!important;filter:url(#ledGlow);animation:viewerBatteryPulse 1.5s ease-in-out infinite}.scenario-source-glow{fill:#38bdf8!important;opacity:.15;stroke:none!important;filter:url(#ledGlow);animation:viewerScenarioPulse 1.5s ease-in-out infinite}.led-glow{fill:#ef4444;opacity:.3;filter:url(#ledGlow);stroke:none;animation:viewerLedPulse 1.25s ease-in-out infinite}.lamp-glow{fill:#ffd84a;opacity:.24;filter:url(#ledGlow);stroke:none;animation:viewerLampPulse 1.4s ease-in-out infinite}.meter-body{fill:#0b1728!important}.meter-glow{fill:#dce51a!important;opacity:.13;stroke:none!important;filter:url(#ledGlow);animation:viewerMeterPulse 1.5s ease-in-out infinite}.meter-scale,.meter-tick{stroke:#94a3b8!important;stroke-width:2!important}.meter-needle{stroke:#dce51a!important;stroke-width:2.5!important}.meter-pivot{fill:#dce51a!important;stroke:none!important}.meter-name{fill:#f4f7fb;font-size:13px;font-weight:700;text-anchor:middle;letter-spacing:0}.meter-reading{fill:#dce51a;font-size:12px;font-weight:700;text-anchor:middle;letter-spacing:0}.led-rays{stroke:#ff4d5a!important}.source-wave{stroke-width:2.5!important}.legend rect{fill:#06101d;stroke:#314257}.legend text{fill:#d7dfeb;font-size:11px;letter-spacing:0}.legend-title{font-weight:700}.legend .wire{stroke-width:3}.connector rect{fill:#0b1728}.connector circle{fill:#0b1728}@keyframes viewerCurrent{to{stroke-dashoffset:-38}}@keyframes viewerTransient{from{stroke-dashoffset:18;opacity:.68}to{stroke-dashoffset:-18;opacity:1}}@keyframes viewerLedPulse{0%,100%{opacity:.2}50%{opacity:.48}}@keyframes viewerLampPulse{0%,100%{opacity:.16}50%{opacity:.38}}@keyframes viewerBatteryPulse{0%,100%{opacity:.1}50%{opacity:.24}}@keyframes viewerScenarioPulse{0%,100%{opacity:.08}50%{opacity:.24}}@keyframes viewerMeterPulse{0%,100%{opacity:.08}50%{opacity:.2}}@media (prefers-reduced-motion:reduce){.wire.active,.wire.transient,.component-flow,.transistor-flow,.led-glow,.lamp-glow,.battery-glow,.scenario-source-glow,.meter-glow{animation:none}}</style>
<style>.terminal-port circle{fill:#071525!important}</style>
<style>.node-constraint{cursor:help}.constraint-leader{fill:none;stroke:#38bdf8;stroke-width:2;stroke-dasharray:4 6;opacity:.8}.constraint-halo{fill:#38bdf8;stroke:none;opacity:.16;filter:url(#ledGlow);animation:viewerConstraintPulse 1.5s ease-in-out infinite}.constraint-node{fill:#071525;stroke:#38bdf8;stroke-width:3}.constraint-badge{fill:#082334;stroke:#38bdf8;stroke-width:1.5}.constraint-label{fill:#dff6ff;font-size:12px;font-weight:700;text-anchor:middle;letter-spacing:0}@keyframes viewerConstraintPulse{0%,100%{opacity:.1}50%{opacity:.28}}@media (prefers-reduced-motion:reduce){.constraint-halo{animation:none}}</style>

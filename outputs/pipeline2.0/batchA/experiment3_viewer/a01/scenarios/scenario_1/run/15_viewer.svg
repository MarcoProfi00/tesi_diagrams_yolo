<style>.viewer-svg{background:transparent;font-family:Arial,sans-serif}.wire,.symbol path,.symbol circle,.symbol rect,.connector rect,.connector circle{fill:none;stroke:#f4f7fb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire.active,.component-flow{fill:none;stroke:#dce51a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 10;animation:viewerCurrent 1s linear infinite}.wire.idle{stroke:#aeb9c9;stroke-dasharray:10 8;opacity:.9}.wire.guide{stroke:#52647c;stroke-dasharray:3 11;opacity:.8}.component-label{fill:#f4f7fb;font-size:13px;font-weight:700;text-anchor:middle;letter-spacing:0}.pin-label{fill:#f4f7fb;font-size:12px;font-weight:700;text-anchor:end;letter-spacing:0}.led-glow{fill:#ef4444;opacity:.3;filter:url(#ledGlow);stroke:none;animation:viewerLedPulse 1.25s ease-in-out infinite}.lamp-glow{fill:#ffd84a;opacity:.24;filter:url(#ledGlow);stroke:none;animation:viewerLampPulse 1.4s ease-in-out infinite}.led-rays{stroke:#ff4d5a!important}.legend rect{fill:#06101d;stroke:#314257}.legend text{fill:#d7dfeb;font-size:11px;letter-spacing:0}.legend-title{font-weight:700}.legend .wire{stroke-width:3}.connector rect{fill:#0b1728}.connector circle{fill:#0b1728}@keyframes viewerCurrent{to{stroke-dashoffset:-38}}@keyframes viewerLedPulse{0%,100%{opacity:.2}50%{opacity:.48}}@keyframes viewerLampPulse{0%,100%{opacity:.16}50%{opacity:.38}}@media (prefers-reduced-motion:reduce){.wire.active,.component-flow,.led-glow,.lamp-glow{animation:none}}</style>

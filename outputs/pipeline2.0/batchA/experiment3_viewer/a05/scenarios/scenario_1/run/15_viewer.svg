<style>.viewer-svg{background:transparent;font-family:Arial,sans-serif}.wire,.symbol path,.symbol circle,.symbol rect,.connector rect,.connector circle{fill:none;stroke:#f4f7fb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire.energized{fill:none;stroke:#22c55e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wire.active,.component-flow,.transistor-flow{fill:none;stroke:#dce51a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 10;animation:viewerCurrent 1s linear infinite}.wire.transient,.component-flow.transient,.transistor-flow.transient{fill:none;stroke:#38bdf8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 9;animation:viewerTransient 1.15s ease-in-out infinite alternate}.wire.idle{stroke:#aeb9c9;stroke-dasharray:10 8;opacity:.9}.wire.guide{stroke:#52647c;stroke-dasharray:3 11;opacity:.8}.component-label{fill:#f4f7fb;font-size:13px;font-weight:700;text-anchor:middle;letter-spacing:0}.pin-label{fill:#f4f7fb;font-size:12px;font-weight:700;text-anchor:end;letter-spacing:0}.battery-polarity{fill:#cbd5e1;font-size:19px;font-weight:700;text-anchor:middle;letter-spacing:0}.battery-polarity.positive{fill:#f8fafc}.battery-body{fill:#0b1728!important}.scenario-battery-body{fill:#082334!important;stroke:#38bdf8!important}.scenario-added-component{cursor:help}.battery-glow{fill:#dce51a!important;opacity:.16;stroke:none!important;filter:url(#ledGlow);animation:viewerBatteryPulse 1.5s ease-in-out infinite}.scenario-source-glow{fill:#38bdf8!important;opacity:.15;stroke:none!important;filter:url(#ledGlow);animation:viewerScenarioPulse 1.5s ease-in-out infinite}.led-glow{fill:#ef4444;opacity:.3;filter:url(#ledGlow);stroke:none;animation:viewerLedPulse 1.25s ease-in-out infinite}.lamp-glow{fill:#ffd84a;opacity:.24;filter:url(#ledGlow);animation:viewerLampPulse 1.4s ease-in-out infinite}.meter-body{fill:#0b1728!important}.meter-glow{fill:#dce51a!important;opacity:.13;stroke:none!important;filter:url(#ledGlow);animation:viewerMeterPulse 1.5s ease-in-out infinite}.meter-scale,.meter-tick{stroke:#94a3b8!important;stroke-width:2!important}.meter-needle{stroke:#dce51a!important;stroke-width:2.5!important}.meter-pivot{fill:#dce51a!important;stroke:none!important}.meter-name{fill:#f4f7fb;font-size:13px;font-weight:700;text-anchor:middle;letter-spacing:0}.meter-reading{fill:#dce51a;font-size:12px;font-weight:700;text-anchor:middle;letter-spacing:0}.led-rays{stroke:#ff4d5a!important}.source-wave{stroke-width:2.5!important}.legend rect{fill:#06101d;stroke:#314257}.legend text{fill:#d7dfeb;font-size:11px;letter-spacing:0}.legend-title{font-weight:700}.legend .wire{stroke-width:3}.connector rect{fill:#0b1728}.connector circle{fill:#0b1728}@keyframes viewerCurrent{to{stroke-dashoffset:-38}}@keyframes viewerTransient{from{stroke-dashoffset:18;opacity:.68}to{stroke-dashoffset:-18;opacity:1}}@keyframes viewerLedPulse{0%,100%{opacity:.2}50%{opacity:.48}}@keyframes viewerLampPulse{0%,100%{opacity:.16}50%{opacity:.38}}@keyframes viewerBatteryPulse{0%,100%{opacity:.1}50%{opacity:.24}}@keyframes viewerScenarioPulse{0%,100%{opacity:.08}50%{opacity:.24}}@keyframes viewerMeterPulse{0%,100%{opacity:.08}50%{opacity:.2}}@media (prefers-reduced-motion:reduce){.wire.active,.wire.transient,.component-flow,.transistor-flow,.led-glow,.lamp-glow,.battery-glow,.scenario-source-glow,.meter-glow{animation:none}}</style>

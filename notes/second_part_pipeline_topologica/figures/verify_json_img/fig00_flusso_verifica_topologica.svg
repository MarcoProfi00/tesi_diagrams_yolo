<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2440" viewBox="0 0 1800 2440" role="img" aria-labelledby="title desc">
  <title id="title">Flusso sperimentale della verifica immagine–Graph JSON</title>
  <desc id="desc">Sette fasi rappresentate mediante riquadri identici, dagli artefatti di input fino alla valutazione del Graph JSON per gli stadi successivi.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#16324F" flood-opacity="0.13"/>
    </filter>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 48px; font-weight: 700; fill: #16324F; }
      .subtitle { font-size: 27px; font-weight: 400; fill: #536A7A; }
      .stage-label { font-size: 23px; font-weight: 700; letter-spacing: 2.2px; }
      .box-title { font-size: 32px; font-weight: 700; fill: #16324F; }
      .body { font-size: 25px; font-weight: 400; fill: #314A5A; }
      .phase { font-size: 28px; font-weight: 700; fill: #FFFFFF; }
      .box-1 { fill: #EAF4FB; stroke: #63A3CE; stroke-width: 3; }
      .box-2 { fill: #EAF7F3; stroke: #69B39A; stroke-width: 3; }
      .box-3 { fill: #F1EEFA; stroke: #9585C2; stroke-width: 3; }
      .box-4 { fill: #EAF6F8; stroke: #6AAAB4; stroke-width: 3; }
      .box-5 { fill: #FFF6E5; stroke: #D8AA4B; stroke-width: 3; }
      .box-6 { fill: #FCEEEA; stroke: #DC927E; stroke-width: 3; }
      .box-7 { fill: #EDF7EC; stroke: #7AAF75; stroke-width: 3; }
      .accent-1 { fill: #0072B2; }
      .accent-2 { fill: #008B68; }
      .accent-3 { fill: #6F5AA8; }
      .accent-4 { fill: #287F8C; }
      .accent-5 { fill: #C98700; }
      .accent-6 { fill: #C94F32; }
      .accent-7 { fill: #4B8C47; }
      .label-1 { fill: #0072B2; }
      .label-2 { fill: #007B5C; }
      .label-3 { fill: #64509A; }
      .label-4 { fill: #236F7A; }
      .label-5 { fill: #A86F00; }
      .label-6 { fill: #B3442B; }
      .label-7 { fill: #3F793C; }
      .pipeline-arrow { fill: #385B73; }
      .icon-bg { fill: #FFFFFF; fill-opacity: 0.72; stroke: #FFFFFF; stroke-width: 2; }
      .icon-line { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1800" height="2440" fill="#F6F8FB"/>

  <g class="font">
    <text x="900" y="74" text-anchor="middle" class="title">Flusso sperimentale della verifica topologica</text>
    <text x="900" y="122" text-anchor="middle" class="subtitle">Confronto controllato tra immagine del circuito e Graph JSON</text>

    <!-- Fase 1 -->
    <g filter="url(#shadow)">
      <rect x="170" y="165" width="1460" height="250" rx="28" class="box-1"/>
    </g>
    <circle cx="250" cy="225" r="34" class="accent-1"/>
    <text x="250" y="235" text-anchor="middle" class="phase">1</text>
    <text x="310" y="218" class="stage-label label-1">ARTEFATTI DI INPUT</text>
    <text x="310" y="278" class="box-title">Immagine del circuito, Graph JSON e configurazione</text>
    <text x="310" y="335" class="body">File PNG  •  componenti, terminali e collegamenti JSON</text>
    <text x="310" y="376" class="body">Prompt di valutazione  •  vocabolario YAML delle classi e dei terminali</text>
    <circle cx="1465" cy="290" r="76" class="icon-bg"/>
    <g class="icon-line" stroke="#0072B2">
      <rect x="1410" y="235" width="78" height="96" rx="9"/>
      <rect x="1442" y="257" width="78" height="96" rx="9"/>
      <circle cx="1495" cy="283" r="8"/>
      <path d="M1458 332 L1478 310 L1492 323 L1504 311"/>
    </g>

    <path d="M892 425 H908 V451 H930 L900 481 L870 451 H892 Z" class="pipeline-arrow"/>

    <!-- Fase 2 -->
    <g filter="url(#shadow)">
      <rect x="170" y="490" width="1460" height="250" rx="28" class="box-2"/>
    </g>
    <circle cx="250" cy="550" r="34" class="accent-2"/>
    <text x="250" y="560" text-anchor="middle" class="phase">2</text>
    <text x="310" y="543" class="stage-label label-2">PREPARAZIONE DELLA RICHIESTA</text>
    <text x="310" y="603" class="box-title">Costruzione del contesto multimodale</text>
    <text x="310" y="660" class="body">Associazione degli input tramite circuit_id  •  validazione del JSON</text>
    <text x="310" y="701" class="body">Calcolo degli hash  •  composizione della richiesta per il judge</text>
    <circle cx="1465" cy="615" r="76" class="icon-bg"/>
    <g class="icon-line" stroke="#008B68">
      <circle cx="1417" cy="580" r="12"/>
      <circle cx="1417" cy="650" r="12"/>
      <circle cx="1512" cy="615" r="16"/>
      <path d="M1430 580 C1460 580 1464 604 1494 610"/>
      <path d="M1430 650 C1460 650 1464 626 1494 620"/>
      <path d="M1512 588 L1512 575 M1512 655 L1512 642"/>
    </g>

    <path d="M892 750 H908 V776 H930 L900 806 L870 776 H892 Z" class="pipeline-arrow"/>

    <!-- Fase 3 -->
    <g filter="url(#shadow)">
      <rect x="170" y="815" width="1460" height="250" rx="28" class="box-3"/>
    </g>
    <circle cx="250" cy="875" r="34" class="accent-3"/>
    <text x="250" y="885" text-anchor="middle" class="phase">3</text>
    <text x="310" y="868" class="stage-label label-3">VALUTAZIONE AGENTICA</text>
    <text x="310" y="928" class="box-title">Judge multimodale GPT-5.4</text>
    <text x="310" y="985" class="body">Dettaglio immagine high  •  reasoning ordinario low</text>
    <text x="310" y="1026" class="body">Produzione di una risposta JSON conforme allo schema vincolato</text>
    <circle cx="1465" cy="940" r="76" class="icon-bg"/>
    <g class="icon-line" stroke="#6F5AA8">
      <rect x="1418" y="897" width="94" height="86" rx="14"/>
      <circle cx="1448" cy="935" r="7" fill="#6F5AA8" stroke="none"/>
      <circle cx="1482" cy="935" r="7" fill="#6F5AA8" stroke="none"/>
      <path d="M1443 961 C1456 973 1474 973 1487 961"/>
      <path d="M1442 897 L1442 882 M1465 897 L1465 882 M1488 897 L1488 882"/>
      <path d="M1418 921 L1403 921 M1418 945 L1403 945 M1512 921 L1527 921 M1512 945 L1527 945"/>
    </g>

    <path d="M892 1075 H908 V1101 H930 L900 1131 L870 1101 H892 Z" class="pipeline-arrow"/>

    <!-- Fase 4 -->
    <g filter="url(#shadow)">
      <rect x="170" y="1140" width="1460" height="250" rx="28" class="box-4"/>
    </g>
    <circle cx="250" cy="1200" r="34" class="accent-4"/>
    <text x="250" y="1210" text-anchor="middle" class="phase">4</text>
    <text x="310" y="1193" class="stage-label label-4">OUTPUT STRUTTURATO PER CIRCUITO</text>
    <text x="310" y="1253" class="box-title">Score, decisione e inventario delle anomalie</text>
    <text x="310" y="1310" class="body">Score totale e quattro sottopunteggi  •  decisione qualitativa</text>
    <text x="310" y="1351" class="body">Utilizzabilità  •  errori per severità  •  mancanze e connessioni errate</text>
    <circle cx="1465" cy="1265" r="76" class="icon-bg"/>
    <g class="icon-line" stroke="#287F8C">
      <path d="M1422 1209 H1490 L1510 1229 V1321 H1422 Z"/>
      <path d="M1490 1209 V1229 H1510"/>
      <path d="M1448 1250 C1438 1250 1438 1268 1448 1268 C1438 1268 1438 1286 1448 1286"/>
      <path d="M1484 1250 C1494 1250 1494 1268 1484 1268 C1494 1268 1494 1286 1484 1286"/>
      <path d="M1448 1302 L1461 1314 L1485 1290"/>
    </g>

    <path d="M892 1400 H908 V1426 H930 L900 1456 L870 1426 H892 Z" class="pipeline-arrow"/>

    <!-- Fase 5 -->
    <g filter="url(#shadow)">
      <rect x="170" y="1465" width="1460" height="250" rx="28" class="box-5"/>
    </g>
    <circle cx="250" cy="1525" r="34" class="accent-5"/>
    <text x="250" y="1535" text-anchor="middle" class="phase">5</text>
    <text x="310" y="1518" class="stage-label label-5">AGGREGAZIONE DEI RISULTATI</text>
    <text x="310" y="1578" class="box-title">Consolidamento per circuito e per batch</text>
    <text x="310" y="1635" class="body">CSV e JSONL  •  report Markdown  •  tabelle riepilogative</text>
    <text x="310" y="1676" class="body">Grafici delle distribuzioni, delle decisioni e dei sottopunteggi</text>
    <circle cx="1465" cy="1590" r="76" class="icon-bg"/>
    <g class="icon-line" stroke="#C98700">
      <path d="M1408 1640 H1520 M1418 1640 V1535"/>
      <rect x="1440" y="1592" width="20" height="48" rx="3"/>
      <rect x="1472" y="1562" width="20" height="78" rx="3"/>
      <rect x="1504" y="1528" width="20" height="112" rx="3"/>
      <path d="M1438 1568 L1478 1539 L1516 1508"/>
    </g>

    <path d="M892 1725 H908 V1751 H930 L900 1781 L870 1751 H892 Z" class="pipeline-arrow"/>

    <!-- Fase 6 -->
    <g filter="url(#shadow)">
      <rect x="170" y="1790" width="1460" height="250" rx="28" class="box-6"/>
    </g>
    <circle cx="250" cy="1850" r="34" class="accent-6"/>
    <text x="250" y="1860" text-anchor="middle" class="phase">6</text>
    <text x="310" y="1843" class="stage-label label-6">AUDIT QUALITATIVO</text>
    <text x="310" y="1903" class="box-title">Revisione dei casi critici, anomali o ambigui</text>
    <text x="310" y="1960" class="body">Controllo manuale  •  eventuali rerun documentati</text>
    <text x="310" y="2001" class="body">Conservazione degli output originali e motivazione delle scelte finali</text>
    <circle cx="1465" cy="1915" r="76" class="icon-bg"/>
    <g class="icon-line" stroke="#C94F32">
      <circle cx="1447" cy="1897" r="42"/>
      <path d="M1477 1927 L1515 1965"/>
      <path d="M1428 1898 L1442 1912 L1468 1884"/>
    </g>

    <path d="M892 2050 H908 V2076 H930 L900 2106 L870 2076 H892 Z" class="pipeline-arrow"/>

    <!-- Fase 7 -->
    <g filter="url(#shadow)">
      <rect x="170" y="2115" width="1460" height="250" rx="28" class="box-7"/>
    </g>
    <circle cx="250" cy="2175" r="34" class="accent-7"/>
    <text x="250" y="2185" text-anchor="middle" class="phase">7</text>
    <text x="310" y="2168" class="stage-label label-7">ESITO DELLA VERIFICA</text>
    <text x="310" y="2228" class="box-title">Valutazione dell’idoneità del Graph JSON</text>
    <text x="310" y="2285" class="body">Base strutturata per SPICE e troubleshooting, subordinata a controlli</text>
    <text x="310" y="2326" class="body">e correzioni prima del trasferimento agli stadi successivi</text>
    <circle cx="1465" cy="2240" r="76" class="icon-bg"/>
    <g class="icon-line" stroke="#4B8C47">
      <path d="M1465 2185 L1512 2203 V2237 C1512 2270 1490 2291 1465 2302 C1440 2291 1418 2270 1418 2237 V2203 Z"/>
      <path d="M1438 2241 L1457 2260 L1493 2222"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #0b355d; }
      .subtitle { font: 400 29px 'Segoe UI', Arial, sans-serif; fill: #506980; }
      .eyebrow { font: 700 25px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; }
      .heading { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0b355d; }
      .body { font: 400 25px 'Segoe UI', Arial, sans-serif; fill: #24445f; }
      .small { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #506980; }
      .num { font: 700 29px 'Segoe UI', Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .flow { fill: none; stroke: #3f5f78; stroke-width: 11; stroke-linecap: butt; stroke-linejoin: round; }
      .arrowhead { fill: #3f5f78; }
      .icon { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1800" height="2400" fill="#f7f9fc"/>
  <text x="900" y="78" class="title" text-anchor="middle">Processo sperimentale sui circuiti complessi</text>
  <text x="900" y="122" class="subtitle" text-anchor="middle">Confronto controllato tra diagnosi da Graph JSON e diagnosi multimodale</text>

  <!-- 1. Input -->
  <g filter="url(#shadow)">
    <rect x="170" y="165" width="1460" height="250" rx="30" fill="#e8f2fb" stroke="#5ba4d4" stroke-width="4"/>
  </g>
  <circle cx="250" cy="235" r="36" fill="#087bb9"/><text x="250" y="237" class="num">1</text>
  <text x="310" y="228" class="eyebrow" fill="#087bb9">PREPARAZIONE DEL CASO</text>
  <text x="310" y="282" class="heading">Artefatti sperimentali associati al circuito</text>
  <text x="310" y="332" class="body">Graph JSON della pipeline 1.0  •  sintomo osservato</text>
  <text x="310" y="373" class="body">estratto testuale del datasheet  •  immagine originale</text>
  <circle cx="1480" cy="290" r="78" fill="#ffffff" fill-opacity="0.76"/>
  <g class="icon" stroke="#087bb9">
    <rect x="1462" y="260" width="76" height="82" rx="8"/>
    <rect x="1428" y="232" width="82" height="104" rx="9" fill="#ffffff"/>
    <path d="M1451 260h36M1451 282h36M1451 304h25"/>
  </g>

  <!-- Fork -->
  <path d="M900 415 V465 H520 V477" class="flow"/>
  <polygon points="497,477 543,477 520,505" class="arrowhead"/>
  <path d="M900 465 H1280 V477" class="flow"/>
  <polygon points="1257,477 1303,477 1280,505" class="arrowhead"/>
  <rect x="664" y="433" width="472" height="42" rx="21" fill="#f7f9fc"/>
  <text x="900" y="462" class="small" text-anchor="middle">DUE CONDIZIONI ESEGUITE SUGLI STESSI CASI</text>

  <!-- 2A -->
  <g filter="url(#shadow)"><rect x="170" y="505" width="700" height="300" rx="30" fill="#e7f6f1" stroke="#54ad91" stroke-width="4"/></g>
  <circle cx="240" cy="570" r="34" fill="#009373"/><text x="240" y="572" class="num">2A</text>
  <text x="295" y="562" class="eyebrow" fill="#008a70">INPUT TESTUALE</text>
  <text x="220" y="647" class="heading">JSON + sintomo + datasheet</text>
  <text x="220" y="696" class="body">La rappresentazione strutturata è</text>
  <text x="220" y="734" class="body">l’unica descrizione del circuito.</text>
  <rect x="220" y="753" width="370" height="38" rx="19" fill="#d3eee5"/>
  <text x="405" y="780" class="small" text-anchor="middle" fill="#08735d">IMMAGINE NON FORNITA AL MODELLO</text>
  <circle cx="770" cy="655" r="66" fill="#ffffff" fill-opacity="0.8"/>
  <g class="icon" stroke="#009373"><path d="M744 620l-23 35 23 35M796 620l23 35-23 35M783 611l-26 88"/></g>

  <!-- 2B -->
  <g filter="url(#shadow)"><rect x="930" y="505" width="700" height="300" rx="30" fill="#f0ecfb" stroke="#8c78c6" stroke-width="4"/></g>
  <circle cx="1000" cy="570" r="34" fill="#6d57b3"/><text x="1000" y="572" class="num">2B</text>
  <text x="1055" y="562" class="eyebrow" fill="#6d57b3">INPUT MULTIMODALE</text>
  <text x="980" y="647" class="heading">JSON + immagine + sintomo</text>
  <text x="980" y="696" class="body">Il modello può integrare il grafo con</text>
  <text x="980" y="734" class="body">le evidenze visive dello schema.</text>
  <rect x="980" y="753" width="298" height="38" rx="19" fill="#e3dcf5"/>
  <text x="1129" y="780" class="small" text-anchor="middle" fill="#6049a2">DATASHEET, SE DISPONIBILE</text>
  <circle cx="1530" cy="655" r="66" fill="#ffffff" fill-opacity="0.8"/>
  <g class="icon" stroke="#6d57b3"><rect x="1487" y="617" width="86" height="76" rx="9"/><circle cx="1512" cy="640" r="8"/><path d="M1498 679l23-24 17 17 13-13 13 20"/></g>

  <!-- Merge to models -->
  <path d="M520 805 V855 H900" class="flow"/>
  <path d="M1280 805 V855 H900 V887" class="flow"/>
  <polygon points="877,887 923,887 900,915" class="arrowhead"/>

  <!-- 3. Models -->
  <g filter="url(#shadow)"><rect x="170" y="915" width="1460" height="220" rx="30" fill="#fff3df" stroke="#e1a536" stroke-width="4"/></g>
  <circle cx="250" cy="980" r="36" fill="#d88e00"/><text x="250" y="982" class="num">3</text>
  <text x="310" y="973" class="eyebrow" fill="#b87500">GENERAZIONE CONTROLLATA</text>
  <text x="310" y="1027" class="heading">8 modelli GPT sotto test</text>
  <text x="310" y="1077" class="body">Stesso prompt diagnostico, stessi circuiti e stessa procedura per entrambe le condizioni</text>
  <circle cx="1480" cy="1025" r="70" fill="#ffffff" fill-opacity="0.78"/>
  <g class="icon" stroke="#d88e00"><rect x="1442" y="987" width="76" height="76" rx="14"/><rect x="1461" y="1006" width="38" height="38" rx="3"/><path d="M1455 975v12M1480 975v12M1505 975v12M1455 1063v12M1480 1063v12M1505 1063v12M1430 1000h12M1430 1025h12M1430 1050h12M1518 1000h12M1518 1025h12M1518 1050h12"/></g>

  <path d="M900 1135 V1177" class="flow"/>
  <polygon points="877,1177 923,1177 900,1205" class="arrowhead"/>

  <!-- 4. Diagnosis -->
  <g filter="url(#shadow)"><rect x="170" y="1205" width="1460" height="220" rx="30" fill="#e9f7eb" stroke="#6eb476" stroke-width="4"/></g>
  <circle cx="250" cy="1270" r="36" fill="#45934a"/><text x="250" y="1272" class="num">4</text>
  <text x="310" y="1263" class="eyebrow" fill="#3c8241">RISPOSTA CANDIDATA</text>
  <text x="310" y="1317" class="heading">Generazione della diagnosi tecnica</text>
  <text x="310" y="1367" class="body">Cause ordinate per probabilità  •  controlli pratici e verificabili</text>
  <circle cx="1480" cy="1315" r="70" fill="#ffffff" fill-opacity="0.78"/>
  <g class="icon" stroke="#45934a">
    <rect x="1436" y="1267" width="88" height="98" rx="10"/>
    <path d="M1453 1293l7 7 13-17M1453 1317l7 7 13-17M1453 1341l7 7 13-17M1486 1293h22M1486 1317h22M1486 1341h22"/>
  </g>

  <path d="M900 1425 V1500 H520 V1522" class="flow"/>
  <polygon points="497,1522 543,1522 520,1550" class="arrowhead"/>

  <!-- 5. Judge packet -->
  <g filter="url(#shadow)"><rect x="170" y="1550" width="700" height="330" rx="30" fill="#e8f5f7" stroke="#45a0ae" stroke-width="4"/></g>
  <circle cx="240" cy="1615" r="34" fill="#278999"/><text x="240" y="1617" class="num">5</text>
  <text x="295" y="1607" class="eyebrow" fill="#237987">JUDGE PACKET</text>
  <text x="220" y="1690" class="heading" style="font-size:31px">Pacchetto completo per il judge</text>
  <text x="220" y="1738" class="body">JSON + immagine + sintomo</text>
  <text x="220" y="1776" class="body">+ datasheet disponibile</text>
  <text x="220" y="1814" class="body">+ risposta candidata + tipo di input</text>
  <rect x="220" y="1829" width="420" height="40" rx="20" fill="#cfeaed"/>
  <text x="430" y="1857" class="small" text-anchor="middle" fill="#176b77">IL JUDGE RICEVE SEMPRE L’IMMAGINE</text>
  <circle cx="775" cy="1715" r="60" fill="#ffffff" fill-opacity="0.82"/>
  <g class="icon" stroke="#278999"><path d="M744 1673h47l20 20v67h-67zM791 1673v20h20"/><circle cx="779" cy="1728" r="16"/><path d="M791 1740l19 19"/></g>

  <!-- Arrow packet to judge -->
  <path d="M870 1715 H902" class="flow"/>
  <polygon points="902,1692 902,1738 930,1715" class="arrowhead"/>

  <!-- 6. Judge -->
  <g filter="url(#shadow)"><rect x="930" y="1550" width="700" height="330" rx="30" fill="#f0ecfb" stroke="#8c78c6" stroke-width="4"/></g>
  <circle cx="1000" cy="1615" r="34" fill="#6d57b3"/><text x="1000" y="1617" class="num">6</text>
  <text x="1055" y="1607" class="eyebrow" fill="#6d57b3">VALUTAZIONE AGENTICA</text>
  <text x="980" y="1690" class="heading">Judge multimodale GPT-5.5</text>
  <text x="980" y="1738" class="body">7 criteri da 0 a 3</text>
  <text x="980" y="1776" class="body">score complessivo da 0 a 21</text>
  <text x="980" y="1814" class="body">verdetto, errori e aspetti mancanti</text>
  <rect x="980" y="1829" width="365" height="40" rx="20" fill="#e1daf4"/>
  <text x="1162" y="1857" class="small" text-anchor="middle" fill="#6049a2">TOP-1 E TOP-3 SECONDO IL JUDGE</text>
  <circle cx="1530" cy="1715" r="60" fill="#ffffff" fill-opacity="0.82"/>
  <g class="icon" stroke="#6d57b3">
    <path d="M1530 1673v79M1487 1692h86M1500 1752h60"/>
    <path d="M1505 1692l-22 37h44l-22-37zM1555 1692l-22 37h44l-22-37z"/>
  </g>

  <path d="M1280 1880 V1950 H900 V1972" class="flow"/>
  <polygon points="877,1972 923,1972 900,2000" class="arrowhead"/>

  <!-- 7. Results -->
  <g filter="url(#shadow)"><rect x="170" y="2000" width="1460" height="290" rx="30" fill="#fff0eb" stroke="#df876a" stroke-width="4"/></g>
  <circle cx="250" cy="2065" r="36" fill="#cc5532"/><text x="250" y="2067" class="num">7</text>
  <text x="310" y="2058" class="eyebrow" fill="#bb4728">AGGREGAZIONE E CONFRONTO</text>
  <text x="310" y="2112" class="heading">Analisi dei risultati per modello, input e circuito</text>
  <text x="310" y="2162" class="body">Qualità diagnostica  •  contributo dell’immagine  •  costo  •  latenza</text>
  <rect x="310" y="2190" width="760" height="58" rx="29" fill="#f8dcd3"/>
  <text x="690" y="2229" class="heading" text-anchor="middle" style="font-size:27px">2 batch  •  16 circuiti  •  8 modelli  •  2 input  •  256 risposte</text>
  <circle cx="1480" cy="2145" r="78" fill="#ffffff" fill-opacity="0.8"/>
  <g class="icon" stroke="#cc5532"><path d="M1435 2107v76h96M1452 2170v-29h18v29M1482 2170v-51h18v51M1512 2170v-78h18v78"/><path d="M1449 2118l30-22 28 9 27-31"/></g>

  <text x="900" y="2350" class="small" text-anchor="middle">Protocollo ripetibile applicato a entrambi i batch; nessuna delle due condizioni costituisce una decisione Sì/No.</text>
</svg>

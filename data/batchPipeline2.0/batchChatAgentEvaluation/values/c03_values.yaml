# Valori manuali per c03, amplificatore audio a singola alimentazione con
# TDA2003. I valori passivi e l'alimentazione derivano dalle label visibili;
# il segnale audio e il modello funzionale dell'integrato sono assunzioni
# esplicite del testbench.

circuit_id: c03

supplies:
  VCC_18:
    terminal: terminal26.3_t1
    value: 18
    unit: V
    reference: 0
    type: dc
    source: manual_from_image_label
    label_text: "+18 V DC"

  AUDIO_IN:
    terminal: terminal26.1_t1
    return_terminal: terminal26.2_t1
    reference: 0
    type: sin
    waveform: sin
    value: 0.02
    unit: V
    offset: 0
    amplitude: 0.02
    frequency: 1000
    frequency_unit: Hz
    source: manual_testbench_assumption
    label_text: "Audio IN: sinusoidale 20 mV picco, 1 kHz"

components:
  polarized_capacitor20.1:
    value: 10
    unit: uf
    source: manual_from_image_label
    label_text: "C7 10 uF"
    viewer_override:
      label: C7
      display_value: 10 uF

  polarized_capacitor20.2:
    value: 470
    unit: uf
    source: manual_from_image_label
    label_text: "C4 470 uF"
    viewer_override:
      label: C4
      display_value: 470 uF

  polarized_capacitor20.3:
    value: 1000
    unit: uf
    source: manual_from_image_label
    label_text: "C1 1000 uF"
    viewer_override:
      label: C1
      display_value: 1000 uF

  polarized_capacitor20.4:
    value: 39
    unit: nf
    source: manual_from_image_label
    label_text: "C3 39 nF"
    viewer_override:
      label: C3
      display_value: 39 nF

  polarized_capacitor20.5:
    value: 100
    unit: nf
    source: manual_from_image_label
    label_text: "C2 100 nF"
    viewer_override:
      label: C2
      display_value: 100 nF

  polarized_capacitor20.6:
    value: 1000
    unit: uf
    source: manual_from_image_label
    label_text: "C5 1000 uF"
    viewer_override:
      label: C5
      display_value: 1000 uF

  polarized_capacitor20.7:
    value: 100
    unit: nf
    source: manual_from_image_label
    label_text: "C6 100 nF"
    viewer_override:
      label: C6
      display_value: 100 nF

  resistor22.1:
    value: 39
    unit: ohm
    source: manual_from_image_label
    label_text: "R1 39 ohm"
    viewer_override:
      label: R1
      display_value: 39 ohm

  resistor22.2:
    value: 2.2
    unit: ohm
    source: manual_from_image_label
    label_text: "R3 2.2 ohm"
    viewer_override:
      label: R3
      display_value: 2.2 ohm

  resistor22.3:
    value: 220
    unit: ohm
    source: manual_from_image_label
    label_text: "R2 220 ohm"
    viewer_override:
      label: R2
      display_value: 220 ohm

  resistor22.4:
    value: 1
    unit: ohm
    source: manual_from_image_label
    label_text: "R4 1 ohm"
    viewer_override:
      label: R4
      display_value: 1 ohm

  operational_amplifier19.1:
    model: TDA2003_SIMPLE
    source: manual_image_validation_TDA2003_pin_mapping
    label_text: "IC1 TDA2003; modello funzionale SPICE"
    viewer_override:
      visual_class: operational_amplifier
      label: IC1
      display_value: TDA2003
      tooltip: "IC1 TDA2003; equivalente funzionale per il testbench"
    spice_override:
      emit_as: subcircuit
      pin_order: [INP, INM, VCC, VEE, OUT]
      node_refs:
        INP: operational_amplifier19.1_in1
        INM: operational_amplifier19.1_in2
        VCC: operational_amplifier19.1_aux1
        VEE: operational_amplifier19.1_aux2
        OUT: operational_amplifier19.1_out

  speaker24.1:
    spice_override:
      emit_as: resistive_load
      equivalent_resistance: 4
      resistance_unit: ohm
      node_order: [t1, t2]
      semantic_role: speaker_equivalent
    source: manual_from_image_label
    label_text: "K1 speaker equivalente 4 ohm"
    viewer_override:
      visual_class: speaker
      label: K1
      display_value: 4 ohm

nodes:
  terminal26.1_t1:
    label: INPUT
    source: manual_from_image_label
    label_text: "Ingresso audio"

  terminal26.2_t1:
    label: INPUT_RETURN
    spice_node: 0
    source: manual_from_image_ground
    label_text: "Ritorno ingresso audio"

  terminal26.3_t1:
    label: VCC_18
    source: manual_from_image_label
    label_text: "+18 V DC"

  operational_amplifier19.1_in2:
    label: INVERTING_INPUT
    source: manual_from_validated_graph

  operational_amplifier19.1_out:
    label: IC_OUTPUT
    source: manual_from_validated_graph

  polarized_capacitor20.2_negative:
    label: FEEDBACK_DIVIDER
    source: manual_from_validated_graph

  speaker24.1_t1:
    label: AUDIO_OUT
    source: manual_from_validated_graph

simulation:
  analyses: [op, tran]
  tran:
    step: 10us
    stop: 20ms

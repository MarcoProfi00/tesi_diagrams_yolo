# Valori manuali per ic03, lampeggiatore per lampada con LM317T.
# Gli ID provengono dal Graph JSON validato della Pipeline 1.0. Alimentazione,
# resistori e condensatori sono leggibili nello schema. La potenza della
# lampada non e' specificata: il suo equivalente e quindi un'assunzione
# esplicita e riproducibile del testbench.

circuit_id: ic03

supplies:
  VCC_12:
    # Il terminale +12 V viene rappresentato come sorgente ideale rispetto
    # alla massa gia presente nel Graph, senza alterare la topologia estratta.
    terminal: terminal26.1_t1
    type: dc
    value: 12
    unit: V
    reference: 0
    source: manual_from_image_label
    label_text: "+12 V DC"
    viewer_override:
      visual_class: voltage_source
      label: VCC
      display_value: +12 V

components:
  # R1 parte dal pin ADJ.
  resistor22.3:
    value: 10
    unit: kohm
    source: manual_from_image_label
    label_text: "R1 10 kohm"
    viewer_override:
      label: R1
      display_value: 10 kohm

  # R2 e' il resistore centrale della scala di temporizzazione.
  resistor22.1:
    value: 10
    unit: kohm
    source: manual_from_image_label
    label_text: "R2 10 kohm"
    viewer_override:
      label: R2
      display_value: 10 kohm

  # R3 chiude a massa la scala di temporizzazione.
  resistor22.2:
    value: 10
    unit: kohm
    source: manual_from_image_label
    label_text: "R3 10 kohm"
    viewer_override:
      label: R3
      display_value: 10 kohm

  # C1 e' il condensatore di ingresso tra IN e massa.
  polarized_capacitor20.1:
    value: 2.2
    unit: uf
    source: manual_from_image_label
    label_text: "C1 2.2 uF"
    viewer_override:
      label: C1
      display_value: 2.2 uF

  # C2 collega il nodo ADJ all'uscita; il positivo e' sul rail OUT.
  polarized_capacitor20.3:
    value: 10
    unit: uf
    source: manual_from_image_label
    label_text: "C2 10 uF"
    viewer_override:
      label: C2
      display_value: 10 uF

  # C3 collega il nodo R1-R2 all'uscita; il positivo e' sul rail OUT.
  polarized_capacitor20.2:
    value: 10
    unit: uf
    source: manual_from_image_label
    label_text: "C3 10 uF"
    viewer_override:
      label: C3
      display_value: 10 uF

  # C4 collega il nodo R2-R3 all'uscita; il positivo e' sul rail OUT.
  polarized_capacitor20.4:
    value: 10
    unit: uf
    source: manual_from_image_label
    label_text: "C4 10 uF"
    viewer_override:
      label: C4
      display_value: 10 uF

  switch25.1:
    # Lo switch S1 e' rappresentato chiuso nello schema e nel Graph validato.
    state: closed
    source: graph_json_state_validated_from_image
    label_text: "S1 chiuso"
    viewer_override:
      label: S1
      display_value: closed

  integrated_circuit11.1:
    # Modello transitorio PSpice ufficiale TI LM317, pacchetto SLVMC40,
    # versione Final 1.00. E' stato verificato autonomamente con ngspice 46
    # usando la modalita' di compatibilita' PSpice.
    model: LM317_TRANS
    source: ti_official_slvmc40_unencrypted_pspice_transient_model
    label_text: "IC1 LM317T; modello transitorio ufficiale TI Final 1.00"
    viewer_override:
      label: IC1
      display_value: LM317T
      tooltip: "IC1 LM317T; modello transitorio ufficiale TI SLVMC40 Final 1.00"
    spice_override:
      emit_as: subcircuit
      # Ordine porte dichiarato da TI: IN ADJ OUT_0 OUT_1. OUT_1 compare
      # nell'interfaccia ma non nel corpo del modello; viene associato allo
      # stesso pin OUT fisico, evitando qualsiasi adattamento nel codice.
      pin_order: [IN, ADJ, OUT_0, OUT_1]
      node_refs:
        IN: integrated_circuit11.1_left_1
        ADJ: integrated_circuit11.1_bottom_1
        OUT_0: integrated_circuit11.1_right_1
        OUT_1: integrated_circuit11.1_right_1

  lamp13.1:
    # Lo schema specifica 12 V ma non la potenza. La descrizione del circuito
    # ammette lampade fino a 12 W: per la base run si usa il limite nominale,
    # Req = V^2/P = 12 ohm. E' un equivalente resistivo a regime, non un
    # modello termico del filamento ne' un valore dedotto dall'immagine.
    nominal_voltage: 12
    nominal_voltage_unit: V
    assumed_nominal_power: 12
    power_unit: W
    source: manual_testbench_assumption_using_documented_12w_limit
    label_text: "L1 lampada 12 V; equivalente assunto 12 ohm (12 W)"
    spice_override:
      emit_as: resistive_load
      equivalent_resistance: 12
      resistance_unit: ohm
      node_order: [t1, t2]
      semantic_role: lamp_equivalent
    viewer_override:
      visual_class: lamp
      label: L1
      display_value: 12 V Lamp
      tooltip: "Lampada 12 V; testbench SPICE resistivo 12 ohm, potenza assunta 12 W"

nodes:
  terminal26.1_t1:
    label: VCC_12
    source: manual_from_image_label
    label_text: "+12 V DC"

  terminal26.2_t1:
    label: SUPPLY_RETURN
    source: manual_from_image_ground_connection
    label_text: "Ritorno alimentazione a massa"

  gnd9.1_t1:
    label: GND
    source: graph_json_ground

  integrated_circuit11.1_left_1:
    label: REGULATOR_IN
    source: manual_from_validated_graph_pin_in

  integrated_circuit11.1_right_1:
    label: FLASH_OUTPUT
    source: manual_from_validated_graph_pin_out

  integrated_circuit11.1_bottom_1:
    label: REGULATOR_ADJ
    source: manual_from_validated_graph_pin_adj

  polarized_capacitor20.2_negative:
    label: TIMING_R1_R2
    source: manual_from_validated_graph

  polarized_capacitor20.4_negative:
    label: TIMING_R2_R3
    source: manual_from_validated_graph

simulation:
  # Oscillatore: l'analisi utile e' il transitorio. Il modello ufficiale e la
  # rete completa sono stati provati autonomamente con il carico da 12 ohm.
  # Dopo lo startup l'uscita percorre circa 0.04 V - 11.50 V; 20 secondi
  # consentono di osservare la dinamica senza produrre un dataset eccessivo.
  analyses: [tran]
  tran:
    step: 2ms
    stop: 20s

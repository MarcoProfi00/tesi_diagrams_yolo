# Valori manuali per ic02, amplificatore audio a doppia alimentazione LM1875.
# Gli ID provengono dal Graph JSON validato della Pipeline 1.0. I valori dei
# passivi e delle rail sono leggibili nello schema; ampiezza e frequenza del
# segnale di ingresso sono assunzioni esplicite e riproducibili del testbench.

circuit_id: ic02

supplies:
  VCC_25:
    terminal: terminal26.2_t1
    type: dc
    value: 25
    unit: V
    reference: 0
    source: manual_from_image_label
    label_text: "+25 V DC"
    viewer_override:
      visual_class: voltage_source
      label: VCC
      display_value: +25 V

  VEE_N25:
    terminal: terminal26.3_t1
    type: dc
    value: -25
    unit: V
    reference: 0
    source: manual_from_image_label
    label_text: "-25 V DC"
    viewer_override:
      visual_class: voltage_source
      label: VEE
      display_value: -25 V

  AUDIO_IN:
    # Lo schema indica soltanto IN. Una sinusoide piccola mantiene il modello
    # nella regione lineare e rende osservabile il guadagno chiuso nominale.
    terminal: terminal26.1_t1
    return_terminal: terminal26.1_t2
    type: sin
    waveform: sin
    value: 0.02
    unit: V
    offset: 0
    amplitude: 0.02
    frequency: 1000
    frequency_unit: Hz
    reference: 0
    source: manual_testbench_assumption
    label_text: "Audio IN: sinusoidale 20 mV picco, 1 kHz"
    viewer_override:
      label: AUDIO IN
      display_value: 20 mVpk @ 1 kHz
      tooltip: "Testbench SPICE: SIN(0 20m 1k)"

components:
  # R5, resistenza serie del jack d'ingresso.
  resistor22.1:
    value: 1
    unit: kohm
    source: manual_from_image_label
    label_text: "R5 1 kohm"
    viewer_override:
      label: R5
      display_value: 1 kohm

  # R4 porta a massa il lato precedente al condensatore di accoppiamento.
  resistor22.2:
    value: 1
    unit: Mohm
    source: manual_from_image_label
    label_text: "R4 1 Mohm"
    viewer_override:
      label: R4
      display_value: 1 Mohm

  # R3 polarizza a massa l'ingresso non invertente.
  resistor22.3:
    value: 22
    unit: kohm
    source: manual_from_image_label
    label_text: "R3 22 kohm"
    viewer_override:
      label: R3
      display_value: 22 kohm

  # R2 e C1 formano il ramo inferiore della rete di feedback AC.
  resistor22.4:
    value: 10
    unit: kohm
    source: manual_from_image_label
    label_text: "R2 10 kohm"
    viewer_override:
      label: R2
      display_value: 10 kohm

  # R1 collega l'uscita all'ingresso invertente.
  resistor22.5:
    value: 180
    unit: kohm
    source: manual_from_image_label
    label_text: "R1 180 kohm"
    viewer_override:
      label: R1
      display_value: 180 kohm

  # R6 e C7 costituiscono la rete di Zobel in uscita.
  resistor22.6:
    value: 1
    unit: ohm
    source: manual_from_image_label
    label_text: "R6 1 ohm"
    viewer_override:
      label: R6
      display_value: 1 ohm

  polarized_capacitor20.1:
    value: 1
    unit: uf
    source: manual_from_image_label
    label_text: "C4 1 uF"
    viewer_override:
      label: C4
      display_value: 1 uF

  polarized_capacitor20.2:
    value: 22
    unit: uf
    source: manual_from_image_label
    label_text: "C1 22 uF"
    viewer_override:
      label: C1
      display_value: 22 uF

  polarized_capacitor20.3:
    # C2 e' non polarizzato nello schema, ma la classe Graph resta quella
    # rilevata dalla Pipeline 1.0; per SPICE viene comunque emesso come C.
    value: 100
    unit: nf
    source: manual_from_image_label
    label_text: "C2 100 nF"
    viewer_override:
      label: C2
      display_value: 100 nF

  polarized_capacitor20.4:
    # C6, disaccoppiamento non polarizzato della rail positiva.
    value: 100
    unit: nf
    source: manual_from_image_label
    label_text: "C6 100 nF"
    viewer_override:
      label: C6
      display_value: 100 nF

  polarized_capacitor20.5:
    value: 220
    unit: uf
    source: manual_from_image_label
    label_text: "C3 220 uF"
    viewer_override:
      label: C3
      display_value: 220 uF

  polarized_capacitor20.6:
    value: 220
    unit: uf
    source: manual_from_image_label
    label_text: "C5 220 uF"
    viewer_override:
      label: C5
      display_value: 220 uF

  polarized_capacitor20.7:
    # C7 e' non polarizzato nello schema.
    value: 0.22
    unit: uf
    source: manual_from_image_label
    label_text: "C7 0.22 uF"
    viewer_override:
      label: C7
      display_value: 0.22 uF

  fuse8.1:
    state: closed
    current_rating: 2
    current_rating_unit: A
    source: manual_from_image_label
    label_text: "F2 2 A, chiuso"
    viewer_override:
      label: F2
      display_value: 2 A

  fuse8.2:
    state: closed
    current_rating: 2
    current_rating_unit: A
    source: manual_from_image_label
    label_text: "F1 2 A, chiuso"
    viewer_override:
      label: F1
      display_value: 2 A

  integrated_circuit11.1:
    # Modello PSpice ufficiale TI LM1875 Rev. A, pacchetto SNAM066A.
    # La .SUBCKT LM1875_0 e' stata verificata autonomamente con ngspice 46
    # usando la modalita' di compatibilita' PSpice.
    model: LM1875_0
    source: ti_official_snam066a_pspice_model
    label_text: "IC1 LM1875; modello ufficiale TI Rev. A"
    viewer_override:
      label: IC1
      display_value: LM1875
      tooltip: "IC1 LM1875; modello ufficiale TI PSpice Rev. A SNAM066A"
    spice_override:
      emit_as: subcircuit
      # Ordine porte dichiarato da TI: Vin Vip VSS VDD Vout.
      pin_order: [VIN, VIP, VSS, VDD, VOUT]
      node_refs:
        VIN: integrated_circuit11.1_left_2
        VIP: integrated_circuit11.1_left_1
        VSS: integrated_circuit11.1_bottom_1
        VDD: integrated_circuit11.1_top_1
        VOUT: integrated_circuit11.1_right_1

  speaker24.1:
    # Lo speaker reale viene rappresentato con il carico resistivo nominale
    # indicato nello schema; il viewer continua a mostrarne il simbolo.
    spice_override:
      emit_as: resistive_load
      equivalent_resistance: 4
      resistance_unit: ohm
      node_order: [t1, t2]
      semantic_role: speaker_equivalent
    source: manual_from_image_label
    label_text: "K1 speaker equivalente 4 ohm"
    viewer_override:
      visual_class: speaker
      label: K1
      display_value: 4 ohm

nodes:
  terminal26.1_t1:
    label: AUDIO_IN
    source: manual_from_image_label
    label_text: "Ingresso audio"

  terminal26.1_t2:
    label: AUDIO_RETURN
    spice_node: 0
    source: manual_from_image_ground
    label_text: "Ritorno ingresso audio a massa"

  terminal26.2_t1:
    label: VCC_25
    source: manual_from_image_label
    label_text: "+25 V DC"

  terminal26.3_t1:
    label: VEE_N25
    source: manual_from_image_label
    label_text: "-25 V DC"

  integrated_circuit11.1_left_1:
    label: NON_INVERTING_INPUT
    source: manual_from_validated_graph_pin1

  integrated_circuit11.1_left_2:
    label: INVERTING_INPUT
    source: manual_from_validated_graph_pin2

  integrated_circuit11.1_right_1:
    label: AUDIO_OUTPUT
    source: manual_from_validated_graph_pin4

simulation:
  analyses: [op, tran]
  tran:
    step: 10us
    stop: 20ms
